# ═══════════════════════════════════════════════════════════════════════════
# OMNIX VISION — Project Configuration
# ═══════════════════════════════════════════════════════════════════════════

[project]
name            = "omnix-vision"
version         = "2.0.0"
description     = "AI-Powered Smart Multimedia Platform — Neon Cyber UI"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"
authors         = [{ name = "OMNIX VISION Team" }]
keywords        = ["streamlit", "computer-vision", "multimedia", "ai", "bilingual"]

dependencies = [
    "streamlit>=1.30.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "qrcode[pil]>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
]


# ═══════════════════════════════════════════════════════════════════════════
# Ruff — fast Python linter
# ═══════════════════════════════════════════════════════════════════════════
[tool.ruff]
line-length    = 100
target-version = "py310"
exclude = [
    ".venv", "venv", "__pycache__", ".git",
    "data", "assets", "build", "dist",
]

[tool.ruff.lint]
# Enable common rule sets, keep it pragmatic for a Streamlit app
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",   # line-length handled separately / long CSS strings
    "E402",   # module import not at top (Streamlit needs set_page_config first)
    "B008",   # function calls in defaults (Streamlit widgets)
    "F841",   # local var assigned but unused (common in _t helpers)
]

[tool.ruff.lint.per-file-ignores]
"tests/*"   = ["E402", "F811", "F401"]
"app.py"    = ["E402"]
"pages/*"   = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["utils", "pages", "styles"]


# ═══════════════════════════════════════════════════════════════════════════
# Black — code formatter
# ═══════════════════════════════════════════════════════════════════════════
[tool.black]
line-length    = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
    \.venv
  | venv
  | data
  | assets
  | __pycache__
)/
'''


# ═══════════════════════════════════════════════════════════════════════════
# Pytest
# ═══════════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
minversion       = "7.0"
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts          = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]


# ═══════════════════════════════════════════════════════════════════════════
# Coverage
# ═══════════════════════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["utils", "pages"]
omit   = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError",
]
