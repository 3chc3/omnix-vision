name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Check black formatting
        run: black --check --diff .
        continue-on-error: true

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # Install only the lightweight deps needed for unit tests.
          # Heavy CV/media libs are optional and mocked in tests.
          pip install streamlit || true

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=utils --cov=pages \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  build-check:
    name: Import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify translation completeness
        run: |
          python -m pip install --upgrade pip
          pip install streamlit || true
          python -c "
          import sys, types
          st = types.ModuleType('streamlit')
          st.session_state = {'language': 'English'}
          st.selectbox = lambda *a, **k: 'English'
          st.markdown = lambda *a, **k: None
          st.rerun = lambda: None
          sys.modules['streamlit'] = st
          from utils.language import missing_translations
          missing = missing_translations('ar')
          assert not missing, f'Missing Arabic translations: {missing}'
          print('✓ All translations complete')
          "
